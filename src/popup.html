<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>学习模式 Study Mode</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="header">
    <img class="logo" src="../icons/icon48.png" alt="" width="28" height="28">
    <h1 class="name">学习模式</h1>
    <span class="site" id="site">—</span>
  </header>

  <label class="row toggle-row" for="enabled">
    <span>启用标题替换</span>
    <span class="switch">
      <input type="checkbox" id="enabled">
      <span class="slider"></span>
    </span>
  </label>

  <section class="current">
    <div class="label">当前标签页标题</div>
    <div class="value" id="current-title">—</div>
  </section>

  <footer class="footer">
    <span>标题池：<b id="pool-size">—</b> 条</span>
    <span class="hint" id="hint"></span>
  </footer>

  <script src="sites.js"></script>
  <script src="popup.js"></script>
</body>
</html>
